<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAX Welcome</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="glass-card">
            <div class="header">
                <div class="avatar-container">
                    <img id="userAvatar" src="" alt="Avatar" style="display: none;" />
                    <div id="avatarPlaceholder" class="avatar-placeholder"></div>
                </div>
                <h1 id="greeting">Добро пожаловать!</h1>
                <p id="username" class="subtitle">Загрузка данных...</p>
            </div>

            <div id="appTabs" class="tabs-nav" style="display: none;">
                <button class="tab-btn active" data-tab="home" type="button">Главная</button>
                <button class="tab-btn" data-tab="links" type="button">Ссылки</button>
                <button class="tab-btn" data-tab="stats" type="button">Статистика</button>
                <button class="tab-btn" data-tab="access" type="button">Доступ</button>
            </div>

            <div id="homePage" class="info-section page-content">
                <div class="info-item">
                    <span class="label">ID Пользователя:</span>
                    <span class="val" id="userId">-</span>
                </div>
                <div class="info-item highlight">
                    <span class="label">Параметр запуска:</span>
                    <span class="val" id="startParam">Не передано</span>
                </div>
            </div>

            <div id="linksDashboard" class="info-section" style="display: none; margin-top: 20px;">
                <h2
                    style="margin-top: 0; margin-bottom: 15px; font-size: 1.2rem; display: flex; align-items: center; justify-content: space-between;">
                    Статистика ссылок
                </h2>
                <div id="linksContainer" style="display: flex; flex-direction: column; gap: 10px;"></div>
            </div>

            <div id="linksManager" class="info-section links-manager page-content" style="display: none; margin-top: 12px;">
                <h2 class="manager-title">Ссылки каналов</h2>
                <p class="manager-subtitle">Доступно для каналов, где вы являетесь администратором.</p>
                <div id="linksManagerBody" class="links-manager-body"></div>
            </div>

            <div id="statsPage" class="info-section page-content placeholder-page" style="display: none; margin-top: 12px;">
                <h2 class="placeholder-title">Статистика</h2>
                <p class="placeholder-text">Раздел в разработке</p>
            </div>

            <div id="accessPage" class="info-section page-content placeholder-page" style="display: none; margin-top: 12px;">
                <h2 class="placeholder-title">Управление доступом</h2>
                <p class="placeholder-text">Раздел в разработке</p>
            </div>


        </div>
    </div>

</body>

</html>
